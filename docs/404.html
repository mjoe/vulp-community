<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1412">
  <title>Page not found · Vulp</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/vulp.png">

  <style>
    :root {
      --bg: #0b1412;
      --panel: #12251e;
      --text: #eaf0ec;
      --muted: #93a59c;
      --accent: #35d0a4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      color: var(--text);
      background: var(--bg);
    }
    img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4); }
    h1 { font-size: 4rem; margin: 18px 0 0; line-height: 1; }
    p { color: var(--muted); margin: 12px 0 28px; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .btn { padding: 11px 20px; border-radius: 8px; background: var(--accent); color: #06130e; }
    .btn:hover { background: #64e2bc; text-decoration: none; }
  </style>
</head>
<body>
  <img src="assets/vulp.png" alt="Vulp icon">
  <h1>404</h1>
  <p>That page doesn't exist on this site.</p>
  <a class="btn" href="https://mjoe.github.io/vulp-community/">Back to Vulp</a>
</body>
</html>
